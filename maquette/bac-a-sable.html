<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette S17 — Bac à sable</title>
<style>
/* Maquette S17, 2e version : manipulation calquée sur Mindustry (code source lu : Binding, DesktopInput,
   MobileInput, PlacementFragment, Placement, Conveyor). Données : bac-a-sable.data.js (bac-a-sable.gen.mjs). */
:root { --bg:#161616; --panel:rgba(18,18,18,.94); --line:#454545; --ink:#e8e8e8; --muted:#9a9a9a; --accent:#ffd37f; --red:#e55454; --green:#5ce677; --orange:#f0a040; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.35 system-ui, "Segoe UI", sans-serif; overflow:hidden; }
button { font:inherit; color:inherit; }
#map { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; user-select:none; cursor:crosshair; }
.pan { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:4px; }
.hidden-ui .pan, .hidden-ui #hint { display:none !important; }
/* Statistiques, en haut à gauche (là où Mindustry met les vagues) */
#stats { left:8px; top:8px; width:280px; max-height:calc(100vh - 16px); overflow:auto; padding:6px 10px 8px; font-size:13px; }
#stats summary { cursor:pointer; font-weight:700; color:var(--accent); min-height:26px; display:flex; align-items:center; }
#stats h4 { margin:8px 0 2px; font-size:12px; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; }
#stats table { width:100%; border-collapse:collapse; } #stats td { padding:1px 0; vertical-align:top; } #stats td.n { text-align:right; white-space:nowrap; padding-left:8px; font-variant-numeric:tabular-nums; }
#stats ul { margin:2px 0; padding-left:16px; } .warn { color:var(--red); } .muted { color:var(--muted); }
/* Barre du haut à droite (maquette) */
#top { right:8px; top:8px; display:flex; gap:4px; padding:4px; align-items:center; }
#top button, #top select { min-height:30px; background:#2a2a2a; border:1px solid var(--line); border-radius:3px; padding:0 8px; cursor:pointer; color:var(--ink); }
#top .tag { font-size:12px; color:var(--muted); padding:0 6px; }
/* Menu de pose, en bas à droite, comme Mindustry : infos, grille de 4, catégories, tiers ; outils sous la grille */
#pf { right:0; bottom:0; border-radius:4px 0 0 0; display:flex; flex-direction:column; width:max-content; }
/* width:0 + min-width:100% : le cadre d'infos prend la largeur du menu sans jamais l'élargir. Sinon, au
   survol, le menu s'élargissait, le bouton survolé bougeait, le cadre se fermait… et ça clignotait. */
#info { border-bottom:3px solid #3a3a3a; padding:8px; width:0; min-width:100%; overflow-wrap:anywhere; }
#info:empty { display:none; }
.i-head { display:flex; gap:8px; align-items:center; }
.i-head img, .i-head svg { flex:none; }
.i-head b { display:block; color:var(--accent); font-size:15px; }
.i-head small { color:var(--muted); }
.i-q { margin-left:auto; flex:none; width:36px; height:36px; background:#2a2a2a; border:1px solid var(--line); border-radius:3px; cursor:pointer; font-weight:700; }
.i-line { margin-top:5px; font-size:13px; }
.i-var { display:flex; flex-wrap:wrap; gap:3px; margin-top:6px; }
.i-var button { width:34px; height:34px; padding:2px; background:#262626; border:1px solid var(--line); border-radius:3px; cursor:pointer; display:grid; place-items:center; }
.i-var button.on { border-color:var(--accent); background:#3d3522; }
.i-var button.locked { opacity:.45; }
.i-chk { display:flex; gap:6px; align-items:center; margin-top:6px; font-size:13px; }
.i-btns { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
.i-btns button, .i-btns a, .i-sel { min-height:30px; background:#2a2a2a; border:1px solid var(--line); border-radius:3px; padding:0 8px; cursor:pointer; color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; }
.i-sel { max-width:100%; margin-top:5px; }
.pf-body { display:flex; }
.pf-left { display:flex; flex-direction:column; border-right:3px solid #3a3a3a; }
#grid { display:grid; grid-template-columns:repeat(4, 46px); grid-auto-rows:46px; height:276px; overflow-y:auto; align-content:start; padding:2px; }
.pf-blk { width:46px; height:46px; padding:4px; background:transparent; border:2px solid transparent; border-radius:3px; cursor:pointer; display:grid; place-items:center; }
.pf-blk:hover { background:#2c2c2c; }
.pf-blk.on { border-color:var(--accent); background:#3d3522; }
.pf-blk.locked img, .pf-blk.locked svg { filter:grayscale(1) brightness(.42); }
.pf-tools { display:flex; border-top:3px solid #3a3a3a; }
.pf-tools button, .pf-tools a { width:48px; height:44px; background:transparent; border:0; cursor:pointer; font-size:20px; display:grid; place-items:center; text-decoration:none; color:var(--ink); }
.pf-tools button.on { background:#3d3522; }
.pf-col { display:flex; flex-direction:column; }
.pf-col + .pf-col { border-left:3px solid #3a3a3a; }
.pf-b { width:40px; height:40px; background:transparent; border:2px solid transparent; border-radius:3px; cursor:pointer; font-size:18px; font-weight:700; display:grid; place-items:center; }
.pf-b.on { border-color:var(--accent); background:#3d3522; color:var(--accent); }
/* Icônes Lucide (S41, comme src/ui/icons.ts) : trait de la couleur du texte. */
.ic { width:1.1em; height:1.1em; vertical-align:-.2em; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.pf-tools .ic, #mob .ic, .pf-b .ic { width:20px; height:20px; }
.pf-b:disabled { opacity:.25; cursor:default; }
.pf-col.tiers .pf-b { font-size:13px; }
/* Indications du bas, comme Mindustry */
#hint { position:fixed; left:50%; bottom:10px; transform:translateX(-50%); max-width:min(760px, calc(100vw - 420px)); text-align:center; font-size:12.5px; color:#ddd; background:rgba(0,0,0,.55); padding:4px 10px; border-radius:3px; pointer-events:none; }
#hint kbd { font:inherit; color:var(--accent); }
/* Outils du téléphone (MobileInput) */
#mob { display:none; left:8px; bottom:8px; padding:4px; gap:4px; flex-direction:column; }
#mob button { width:48px; height:48px; background:#2a2a2a; border:1px solid var(--line); border-radius:3px; font-size:20px; }
#mob button.on { border-color:var(--accent); background:#3d3522; }
/* Fenêtres (infos d'un bloc, schémas, base de données, touches) */
#dlg { position:fixed; inset:0; background:rgba(0,0,0,.82); display:flex; flex-direction:column; align-items:center; overflow:auto; padding:28px 16px 90px; z-index:5; }
#dlg[hidden] { display:none; }
#dlg .in { width:min(760px, 100%); }
#dlg h3 { color:var(--accent); font-size:13px; text-transform:uppercase; letter-spacing:.05em; margin:14px 0 4px; }
#dlg .ttl { display:flex; gap:10px; align-items:center; justify-content:center; font-size:19px; color:var(--accent); font-weight:700; }
#dlg .kv { padding-left:12px; } #dlg .kv div { margin:2px 0; }
#dlg table { border-collapse:collapse; width:100%; } #dlg td, #dlg th { padding:4px 6px; border-bottom:1px solid #333; text-align:left; vertical-align:top; font-size:13px; }
#dlg th { color:var(--accent); font-weight:600; }
#dlg .back { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); min-width:200px; min-height:48px; background:#1d1d1d; border:2px solid #666; border-radius:6px; font-size:16px; cursor:pointer; }
#dlg .db { display:flex; flex-wrap:wrap; gap:3px; }
#dlg textarea { width:100%; min-height:70px; background:#111; color:var(--ink); border:1px solid var(--line); }
#dlg .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:4px 0; }
#dlg .row button, #dlg .row input { min-height:30px; background:#2a2a2a; border:1px solid var(--line); border-radius:3px; color:var(--ink); padding:0 8px; }
@media (max-width: 760px), (pointer: coarse) {
  #mob { display:flex; }
  #hint { display:none; }
}
@media (max-width: 760px) {
  #stats { width:auto; right:8px; max-height:40vh; }
  #top { top:auto; bottom:calc(var(--pfh, 200px) + 8px); }
  #pf { left:0; width:auto; }
  .pf-body { overflow:hidden; }
  .pf-left { flex:1; min-width:0; }
  /* Au téléphone, la grille défile horizontalement (réponse Q14-6) */
  #grid { grid-template-columns:none; grid-auto-flow:column; grid-template-rows:repeat(2, 46px); grid-auto-columns:46px; height:auto; overflow-x:auto; overflow-y:hidden; }
  .pf-col { flex-direction:row; flex-wrap:wrap; width:80px; align-content:flex-start; }
  #mob { bottom:calc(var(--pfh, 200px) + 8px); }
}
</style>
</head>
<body>
<svg id="map" aria-label="Plan du montage">
  <defs>
    <pattern id="grid-p" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width=".04"/></pattern>
    <pattern id="over" width=".5" height=".5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width=".5" height=".5" fill="#c0392b"/><rect width=".25" height=".5" fill="#f5b041"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#fff"/></marker>
  </defs>
  <rect x="-5000" y="-5000" width="10000" height="10000" fill="url(#grid-p)"/>
  <g id="layer"></g><g id="over-l"></g><g id="ghost"></g>
</svg>

<details id="stats" class="pan" open><summary data-ic="chart">Statistiques du montage</summary><div id="stats-in"></div></details>

<div id="top" class="pan">
  <span class="tag">Maquette S17 · 2e version</span>
  <select id="ex" aria-label="Exemples"><option value="">Exemples…</option><option value="1">Press → Roller (tier I)</option><option value="2">5 Roller : tuyau saturé</option><option value="3">Tier III : longueurs et croisement</option></select>
  <button id="b-keys" title="Toutes les commandes" data-ic="keyboard">Touches</button>
  <button id="b-undo" title="Annuler (Ctrl+Z)" aria-label="Annuler" data-ic="undo"></button>
  <button id="b-redo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir" data-ic="redo"></button>
  <button id="b-clear" title="Vider le plan">Vider</button>
</div>

<div id="pf" class="pan">
  <div id="info"></div>
  <div class="pf-body">
    <div class="pf-left">
      <div id="grid"></div>
      <div class="pf-tools">
        <button id="b-schem" title="Schémas (T)" aria-label="Schémas" data-ic="schem"></button>
        <button id="b-db" title="Base de données" aria-label="Base de données" data-ic="db"></button>
        <a href="/#arbre" target="_blank" title="Arbre de recherche (J)" aria-label="Arbre de recherche" data-ic="tree"></a>
        <button id="b-vec" title="Liaisons : sens de chaque raccord (L)" aria-label="Liaisons" data-ic="link"></button>
      </div>
    </div>
    <div id="cats" class="pf-col"></div>
    <div id="tiers" class="pf-col tiers"></div>
  </div>
</div>

<div id="mob" class="pan" aria-label="Outils tactiles">
  <button id="m-break" title="Casser (zone)" aria-label="Casser (zone)" data-ic="break"></button>
  <button id="m-schem" title="Copier une zone" aria-label="Copier une zone" data-ic="select"></button>
  <button id="m-rot" title="Tourner" aria-label="Tourner" data-ic="rotate"></button>
  <button id="m-cancel" title="Lâcher" aria-label="Lâcher" data-ic="close"></button>
  <button id="m-undo" title="Annuler" aria-label="Annuler" data-ic="undo"></button>
</div>

<div id="hint"></div>
<div id="dlg" hidden><div class="in" id="dlg-in"></div><button class="back" id="dlg-back" data-ic="back">Retour</button></div>

<script src="bac-a-sable.data.js"></script>
<script>
// ======================= Icônes =======================
// Tracés Lucide 0.460 (ISC, © Lucide Contributors ; portions © Cole Bemis, Feather, MIT), comme src/ui/icons.ts (S41).
const IC = {
  chart: '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  keyboard: '<path d="M10 8h.01"/><path d="M12 12h.01"/><path d="M14 8h.01"/><path d="M16 12h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M7 16h10"/><path d="M8 12h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>',
  redo: '<path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/>',
  schem: '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
  db: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  tree: '<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  break: '<path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/>',
  select: '<path d="M5 3a2 2 0 0 0-2 2"/><path d="M19 3a2 2 0 0 1 2 2"/><path d="M21 19a2 2 0 0 1-2 2"/><path d="M5 21a2 2 0 0 1-2-2"/><path d="M9 3h1"/><path d="M9 21h1"/><path d="M14 3h1"/><path d="M14 21h1"/><path d="M3 9v1"/><path d="M21 9v1"/><path d="M3 14v1"/><path d="M21 14v1"/>',
  rotate: '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
  close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  back: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  next: '<path d="m9 18 6-6-6-6"/>',
  warn: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  updown: '<path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/>',
  swap: '<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
  // Catégories du menu Build. Pipes : la goutte de la catégorie « liquides » de Mindustry.
  pipes: '<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
  logic: '<rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/>',
  power: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  deco: '<path d="M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v1M9 8a3 3 0 1 0 3 3M9 8h1m5 0a3 3 0 1 1-3 3m3-3h-1m-2 3v-1"/><circle cx="12" cy="8" r="2"/><path d="M12 10v12"/><path d="M12 22c4.2 0 7-1.667 7-5-4.2 0-7 1.667-7 5Z"/><path d="M12 22c-4.2 0-7-1.667-7-5 4.2 0 7 1.667 7 5Z"/>',
  factory: '<path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M17 18h1"/><path d="M12 18h1"/><path d="M7 18h1"/>',
  module: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>',
  misc: '<path d="M8.3 10a.7.7 0 0 1-.626-1.079L11.4 3a.7.7 0 0 1 1.198-.043L16.3 8.9a.7.7 0 0 1-.572 1.1Z"/><rect x="3" y="14" width="7" height="7" rx="1"/><circle cx="17.5" cy="17.5" r="3.5"/>',
  extract: '<path d="M14.531 12.469 6.619 20.38a1 1 0 1 1-3-3l7.912-7.912"/><path d="M15.686 4.314A12.5 12.5 0 0 0 5.461 2.958 1 1 0 0 0 5.58 4.71a22 22 0 0 1 6.318 3.393"/><path d="M17.7 3.7a1 1 0 0 0-1.4 0l-4.6 4.6a1 1 0 0 0 0 1.4l2.6 2.6a1 1 0 0 0 1.4 0l4.6-4.6a1 1 0 0 0 0-1.4z"/><path d="M19.686 8.314a12.501 12.501 0 0 1 1.356 10.225 1 1 0 0 1-1.751-.119 22 22 0 0 0-3.393-6.319"/>',
  tanks: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/>',
};
const ic = (n) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${IC[n]}</svg>`;
for (const el of document.querySelectorAll("[data-ic]")) el.insertAdjacentHTML("afterbegin", ic(el.dataset.ic) + (el.textContent.trim() ? " " : ""));

// ======================= Données =======================
const B = window.BAS;
const BL = Object.fromEntries(B.blocks.map((b) => [b.id, b]));
const IT = B.items;
const ORD = ["N", "E", "S", "W"], DV = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] }, OPP = { N: "S", S: "N", E: "W", W: "E" };
const ROT = (d, r) => ORD[(ORD.indexOf(d) + r) % 4];
const K = (x, y) => x + "," + y;
const ROM = { 1: "I", 2: "II", 3: "III", 4: "IV" };
const fmt = (n, d = 2) => (+n).toLocaleString("fr-FR", { maximumFractionDigits: d });
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const itemName = (i) => IT[i]?.name ?? i;
const isFluid = (i) => !!IT[i]?.fluid;
const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));

// Catégories du menu Build du jeu, dans l'ordre de la capture du tier I (2026-10-26, BAS-01). L'ordre du
// jeu change d'un tier à l'autre ; ici il reste fixe pour que chaque catégorie garde sa place et son raccourci.
// « wiki » : catégorie de machines.json rangée dans cette catégorie du jeu (Storage Silos → Tanks : à confirmer).
const CATS = [
  { id: "Pipes", name: "Pipes", ic: ic("pipes") }, { id: "Logic", name: "Logic", ic: ic("logic") }, { id: "Power", name: "Power", ic: ic("power") },
  { id: "Decorations", name: "Decorations", ic: ic("deco") }, { id: "Factories", name: "Factories", ic: ic("factory") }, { id: "Modular", name: "Modular", ic: ic("module") },
  { id: "Miscellaneous", name: "Misc", ic: ic("misc") }, { id: "Extractors", name: "Extractors", ic: ic("extract") }, { id: "Storage Silos", name: "Tanks", ic: ic("tanks") },
];
const completeLink = (id) => BL[id]?.noEditor
  ? `<span class="muted">${esc(BL[id].name)} n'est pas encore dans l'éditeur de bâtiments (à ajouter).</span>`
  : `<a href="/#contribuer/batiments/${id}" target="_blank">Compléter ${esc(BL[id].name)} ${ic("next")}</a>`;

  el.innerHTML = `<table>${row("Bâtiments", S.b.length - st.pieces)}${row("Pièces de tuyau", st.pieces)}${st.area ? row("Place au sol", st.area.join(" × ") + " cases") : ""}${row("Énergie", fmt(st.energy, 0) + " MF/s")}${row("Pollution", fmt(st.poll, 2) + " %/h")}${row("Prix", "$" + fmt(st.price, 0))}</table>`
    + `<h4>Sorties du montage</h4>${Object.keys(st.outs).length ? `<table>${list(st.outs)}</table>` : `<p class="muted">Rien ne sort.</p>`}`
    + `<h4>À fournir</h4>${Object.keys(st.ext).length ? `<table>${list(st.ext)}</table>` : `<p class="muted">Rien.</p>`}`

}

  if (!d.geo) return `<svg width="${px}" height="${px}" viewBox="0 0 1 1"><rect x=".1" y=".1" width=".8" height=".8" rx=".1" fill="#333" stroke="#666" stroke-width=".04"/><text x=".5" y=".66" font-size=".45" text-anchor="middle" fill="#999">?</text></svg>`;
  const b = { id, x: 0, y: 0, r: 0, u: -1 }, [w, h] = dims(id, 0), m = Math.max(w, h);
  return `<svg width="${px}" height="${px}" viewBox="${(w - m) / 2 - 0.05} ${(h - m) / 2 - 0.05} ${m + 0.1} ${m + 0.1}">${markup(b, {})}</svg>`;

// Cadre d'infos : le bloc survolé dans la grille, sinon le bloc choisi (gardé), sinon le bâtiment survolé ou cliqué.
let infoSig = "";
function head(id, name, sc, q) { return `<div class="i-head">${iconSvg(id, 32)}<div><b>${esc(name)}</b>${sc ? `<small>Raccourci : ${sc}</small>` : ""}</div>${q ? `<button class="i-q" data-info="${id}" title="Plus d'infos (F1)">?</button>` : ""}</div>`; }

function renderInfo(force) {
  const t = ui.hoverBtn ? { k: "e", e: EK[ui.hoverBtn] } : ui.sel ? { k: "e", e: ui.sel.e } : ui.hoverU != null && byU.has(ui.hoverU) ? { k: "b", u: ui.hoverU } : ui.pinned != null && byU.has(ui.pinned) ? { k: "b", u: ui.pinned, pin: true } : null;
  const sig = JSON.stringify([t?.k, t?.e?.key, t?.u, ui.sel?.v, ui.auto, t?.pin]);
  if (!force && sig === infoSig) return; infoSig = sig;
  if (!t) { infoEl.innerHTML = ""; return; }
  let h = "";
  if (t.k === "e") {
    const e = t.e, v = ui.sel?.e === e ? ui.sel.v : e.def, d = BL[v];
    h += head(v, e.fam ? `${entryName(e)} · ${d.name}` : d.name, shortcut(e), !locked(v));
    if (locked(v)) h += `<div class="i-line warn">${ic("warn")} Ports pas encore relevés : ${e.fam ? "cette pièce" : "ce bâtiment"} ne peut pas être posé.</div><div class="i-btns">${completeLink(v)}</div>`;
    h += `<div class="i-line">${d.geo ? dims(v, 0).join(" × ") + " cases · " : ""}$${fmt(d.cost, 0)}${d.pipe ? ` · ${fmt(d.pipe.flow)}/s au plus` : ""}${d.recipes.length ? ` · ${d.recipes.length} recette${d.recipes.length > 1 ? "s" : ""}` : ""}</div>`;
    if (e.fam) {
      h += `<div class="i-var">${VAR[e.fam].map((id) => `<button class="${id === v ? "on" : ""} ${locked(id) ? "locked" : ""}" data-var="${id}" title="${esc(BL[id].name)}${locked(id) ? " (non relevé)" : ""}${BL[id].pipe.rusty ? " (rusty : jamais posé tout seul)" : ""}">${iconSvg(id, 26)}</button>`).join("")}</div>`;
      if (!FAMS[e.fam].large) h += `<label class="i-chk"><input type="checkbox" id="i-auto" ${ui.auto ? "checked" : ""}> Longueur auto : les tuyaux les plus longs possibles${droitLens(e.fam).length < 2 ? ` <span class="muted">(ce tier n'a que des tuyaux courts)</span>` : ""}</label>`;
    }

      const ls = d.pipe.role === "croisement" ? [0, 1] : [0];
      for (const l of ls) { const L = R.lanes.get(b.u + ":" + l); h += `<div class="i-line">${ls.length > 1 ? (l ? `Voie ${ic("updown")} : ` : `Voie ${ic("swap")} : `) : ""}${L?.item ? "porte " + esc(itemName(L.item)) : L?.mixed ? `<span class="warn">mélange</span>` : "vide"} · ${fmt(L?.flow ?? 0)}/s sur ${fmt(d.pipe.flow)}/s${L?.over ? ` · <span class="warn">saturé (${fmt(L.offered)}/s demandés)</span>` : ""}</div>`; }
    } else {
      const mi = R.MI.get(t.u);
      if (mi && d.recipes.length) {
        if (mi.cand.length > 1 || b.choice) h += `<select class="i-sel" id="i-rec"><option value="">— choisir la recette —</option>${mi.cand.map((r) => `<option value="${r.id}" ${mi.rec?.id === r.id ? "selected" : ""}>${esc(recTxt(r))}</option>`).join("")}</select>`;
        else if (mi.rec) h += `<div class="i-line">Recette : ${esc(recTxt(mi.rec))}</div>`;
        h += mi.rec ? `<div class="i-line">Marche : <b>${Math.round(mi.f * 100)} %</b>${mi.txt ? ` · <span class="warn">${esc(mi.txt)}</span>` : ""} · ${fmt((mi.rec.e || 0) * mi.f, 0)} MF/s</div>` : `<div class="i-line warn">${esc(mi.txt ?? "")}</div>`;
      }
    }

  }

  document.documentElement.style.setProperty("--pfh", document.getElementById("pf").offsetHeight + "px");
}
infoEl.addEventListener("click", (ev) => {

document.getElementById("b-db").onclick = () => openDlg(`<div class="ttl">${ic("db")} Base de données</div>` + CATS.map((c) => { const bs = B.blocks.filter((b) => b.cat === c.id); return bs.length ? `<h3>${c.ic} ${c.name}</h3><div class="db">${bs.map((b) => `<button class="pf-blk ${b.geo ? "" : "locked"}" data-db="${b.id}" title="${esc(b.name)}">${iconSvg(b.id, 34)}</button>`).join("")}</div>` : ""; }).join(""));

// Schémas (T) : comme Mindustry, un schéma est une zone copiée, qu'on enregistre et partage par un code.

dlgIn.addEventListener("click", (ev) => {

svg.addEventListener("contextmenu", (e) => e.preventDefault());
svg.addEventListener("mousedown", (e) => { if (e.button === 1) e.preventDefault(); }); // pas de défilement automatique du clic molette
svg.addEventListener("pointerdown", (e) => {

// Tactile (MobileInput) : un doigt déplace, deux doigts zooment, appui long puis glisser = ligne ou zone.
const touches = new Map(); let ts = null;

const mob = (id, f) => (document.getElementById(id).onclick = f);
mob("m-break", () => { ui.breakMode = !ui.breakMode; ui.schemMode = false; ui.sel = null; renderPanel(); syncMob(); });
mob("m-schem", () => { ui.schemMode = !ui.schemMode; ui.breakMode = false; ui.sel = null; renderPanel(); syncMob(); });

// Clavier
const held = new Set(), MOVE = new Set(["KeyW", "KeyA", "KeyS", "KeyD"]);
let digits = [], lastDigit = 0;
function doUndo() { if (!undo.length) return; redo.push(JSON.stringify(S)); S = JSON.parse(undo.pop()); ui.pinned = null; changed(); }
function doRedo() { if (!redo.length) return; undo.push(JSON.stringify(S)); S = JSON.parse(redo.pop()); changed(); }

// ======================= Exemples =======================
function example(n) {
  snap(); S = { b: [], n: 1 }; reindex();
  const put = (id, x, y, r, choice) => { S.b.push({ u: S.n++, id, x, y, r, choice }); reindex(); };
  const pipe = (path, fam) => { const p = pipePlan(path, fam, Infinity); if (!p) return; const rm = new Set(p.remove); S.b = S.b.filter((b) => !rm.has(b.u)); p.add.forEach((a) => S.b.push({ ...a, u: S.n++ })); reindex(); };

  if (n === 2) { for (let i = 0; i < 5; i++) put("roller", i * 5, 0, 0, "roller_01"); pipe([[3, 2], ...line(3, 3, 27, 3)], "o1"); for (let i = 1; i < 5; i++) pipe([[i * 5 + 3, 2], [i * 5 + 3, 3]], "o1"); }

}
function fit() { if (!S.b.length) return; let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const b of S.b) for (const [x, y] of cellsOf(b)) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + 1); y1 = Math.max(y1, y + 1); } const r = svg.getBoundingClientRect(), L = r.width > 760 ? 300 : 0, fw = r.width - L - (r.width > 760 ? 390 : 0); cam.z = Math.max(8, Math.min(48, fw * 0.85 / (x1 - x0), r.height * 0.6 / (y1 - y0))); cam.x = (x0 + x1) / 2 - (L + fw / 2) / cam.z; cam.y = (y0 + y1) / 2 - r.height * 0.42 / cam.z; applyView(); } // centré entre les statistiques et le menu de pose
document.getElementById("ex").onchange = (e) => { if (e.target.value) example(+e.target.value); e.target.value = ""; };
