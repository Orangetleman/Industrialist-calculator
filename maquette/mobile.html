<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maquette mobile — Planificateur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* PLAN-MOBILE.md, phase 1. Charte Plasma (jetons de src/styles.css), volets à plat (R28).
   Nombres du plan : relevés sur le site (Crankshaft 60/min, tout débloqué). Le dessin de l'usine et les ports
   du bac à sable sont schématiques. */
:root {
  --bg: #0e0a18; --surface: #160f25; --panel2: #201733; --ink: #f0ecfa; --muted: #a99cc8; --line: #392a5a;
  --accent: #ff6a1a; --accent-soft: #33190c; --on-accent: #1a0800; --ok: #4ade80; --warn: #ffd23f; --bad: #ff7a9a;
  --in: #38bdf8; --in-soft: #0f2235; --out: #e879f9; --out-soft: #2d1436; --cv: #08070a;
  --stripe: repeating-linear-gradient(45deg, var(--accent) 0 10px, var(--bg) 10px 20px);
  --d: "Audiowide", "Arial Narrow", system-ui, sans-serif; --b: "IBM Plex Sans", system-ui, sans-serif; --m: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #050308; color: var(--ink); font: 16px/1.4 var(--b); }
button, input { font: inherit; color: inherit; background: none; border: 0; padding: 0; border-radius: 0; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--m); }

/* Barre de la maquette (hors du site) */
.lab { height: 40px; display: flex; gap: 4px; align-items: center; justify-content: center; font: 13px var(--b); color: #bbb; background: #050308; white-space: nowrap; }
.lab button { min-height: 32px; padding: 0 10px; border: 1px solid #444; }
.lab button.on { background: #ddd; color: #111; }
.lab .sz { display: none; }
.room { height: calc(100% - 40px); display: grid; grid-template: 100% / 100%; place-items: center; overflow: auto; }
.dev { container: dev / size; position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); user-select: none; -webkit-user-select: none; }
@media (min-width: 900px) and (pointer: fine) {
  .lab .sz { display: contents; }
  .dev { width: var(--w, 390px); height: var(--h, 844px); max-height: 100%; outline: 1px solid #555; }
}

/* Ossature */
.app { position: absolute; inset: 0; display: grid; grid-template: "head" auto "stage" 1fr "bar" auto / 1fr; }
.head { grid-area: head; height: 52px; display: flex; align-items: center; background: var(--surface); position: relative; z-index: 3; padding-left: 14px; }
.head::after { content: ""; position: absolute; inset: auto 0 -3px 0; height: 3px; background: var(--stripe); }
.head .t { flex: 1; min-width: 0; height: 52px; display: flex; align-items: center; gap: 8px; font: 15px var(--d); text-align: left; }
.head .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.head .t b { color: var(--accent); font-weight: 400; white-space: nowrap; }
.head .i { width: 48px; height: 52px; display: grid; place-items: center; }
.head .i.on { color: var(--accent); }
.stage { grid-area: stage; position: relative; overflow: hidden; min-height: 0; margin-top: 3px; }
.scroll { position: absolute; inset: 0; overflow: auto; overscroll-behavior: contain; padding-bottom: 20px; }
.bar { grid-area: bar; display: flex; background: var(--surface); border-top: 1px solid var(--line); z-index: 6; padding-bottom: env(safe-area-inset-bottom); }
.bar button { flex: 1; min-width: 0; height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: var(--muted); position: relative; }
.bar button.on { color: var(--accent); }
.bar button.on::before { content: ""; position: absolute; top: -1px; left: 12%; right: 12%; height: 3px; background: var(--accent); }
.bar .menu { flex: 0 0 72px; background: var(--accent); color: var(--on-accent); }

/* Vues du plan (direction A : en haut du dessin) */
.views { display: flex; background: var(--surface); border-bottom: 1px solid var(--line); position: absolute; z-index: 2; inset: 0 0 auto 0; }
.views button { flex: 1; height: 48px; color: var(--muted); font: 14px var(--d); }
.views button.on { color: var(--ink); box-shadow: inset 0 -3px var(--accent); }

/* Lignes à plat */
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 6px 16px; border-bottom: 1px solid var(--line); text-align: left; }
.row .g { flex: 1; min-width: 0; } .row small { display: block; color: var(--muted); font-size: 14px; }
.row .n { font: 16px var(--m); color: var(--accent); }
.row.on { background: var(--accent-soft); }
.chk { width: 28px; height: 28px; border: 2px solid var(--muted); display: grid; place-items: center; flex: none; }
.done .chk { background: var(--ok); border-color: var(--ok); color: #05210f; } .done .g { color: var(--muted); text-decoration: line-through; }
.sq { width: 40px; height: 40px; flex: none; background: var(--panel2); display: grid; place-items: center; font: 13px var(--d); color: var(--muted); }
.h { font: 15px var(--d); color: var(--accent); padding: 18px 16px 8px; }
.kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-block: 1px solid var(--line); }
.kpi div { background: var(--surface); padding: 10px 16px; font: 20px var(--m); } .kpi small { display: block; font: 14px var(--b); color: var(--muted); }
.cta { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 18px; background: var(--accent); color: var(--on-accent); font-weight: 600; width: 100%; }
.cta.alt { background: var(--panel2); color: var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
.seg { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.seg button { flex: 1 0 auto; min-height: 48px; padding: 0 14px; color: var(--muted); white-space: nowrap; } .seg button.on { color: var(--ink); box-shadow: inset 0 -3px var(--accent); }
.step { display: flex; align-items: stretch; }
.step button { width: 60px; height: 56px; font: 26px var(--m); background: var(--panel2); } .step input, .step output { width: 100px; flex: 1; min-width: 0; text-align: center; font: 22px var(--m); background: var(--bg); display: grid; place-items: center; }
.find { display: flex; align-items: center; gap: 10px; background: var(--bg); padding: 0 16px; border-block: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
.find input { flex: 1; min-width: 0; height: 52px; outline: none; }
.tag { font-size: 13px; padding: 2px 8px; background: var(--panel2); color: var(--muted); }

/* Panneau bas, trois crans */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: var(--surface); border-top: 3px solid var(--accent); z-index: 4; display: flex; flex-direction: column; transform: translateY(calc(100% - var(--v, 84px))); transition: transform .2s ease-out; }
.sheet.drag { transition: none; }
.grip { flex: none; touch-action: none; cursor: grab; }
.grip i { display: block; width: 44px; height: 4px; background: var(--muted); margin: 8px auto 4px; }
.grip .st { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 4px 0 16px; }
.grip .st .g { flex: 1; min-width: 0; font: 15px var(--d); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .grip .st small { display: block; font: 14px var(--m); color: var(--muted); }
.grip .x { width: 52px; height: 52px; display: grid; place-items: center; }
.sheet .body { overflow: auto; overscroll-behavior: contain; max-height: calc(var(--v) - 78px); flex: 1; }
/* Panneau qui couvre (choix, réglages, menu, partage) */
.modal { position: absolute; inset: 0; z-index: 10; background: #050308c0; display: flex; flex-direction: column; justify-content: flex-end; }
.modal .in { background: var(--surface); border-top: 3px solid var(--accent); max-height: 92%; overflow: auto; overscroll-behavior: contain; padding-bottom: env(safe-area-inset-bottom); }
.modal .in.full { height: 92%; }
.mh { display: flex; align-items: center; padding-left: 16px; font: 16px var(--d); position: sticky; top: 0; background: var(--surface); z-index: 3; } .mh span { flex: 1; } .mh button { width: 56px; height: 56px; display: grid; place-items: center; }
.menug { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--line); } .menug button { background: var(--surface); height: 88px; display: grid; place-content: center; justify-items: center; gap: 6px; font-size: 14px; } .menug .on { color: var(--accent); }

/* Dessin */
.map { position: absolute; inset: 0; touch-action: none; background: var(--cv) radial-gradient(#2c2245 1px, transparent 1.5px) 0 0 / 24px 24px; overflow: hidden; }
.w { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.w svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.node { position: absolute; width: 190px; background: #130f1c; border: 1px solid #3b2e5a; padding: 8px 10px; text-align: left; line-height: 1.25; }
.node b { font: 15px var(--d); display: flex; justify-content: space-between; gap: 6px; } .node b em { color: var(--accent); font: 15px var(--m); } .node small { color: var(--muted); font-size: 14px; }
.node.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); } .node.tgt { box-shadow: 0 0 0 3px var(--in); }
.fp { position: absolute; background: #201733; border: 2px solid #4f3d7a; display: grid; place-content: center; text-align: center; font-size: 14px; } .fp.on { border-color: var(--accent); background: var(--accent-soft); } .fp.ok { border-color: var(--ok); }
.float { position: absolute; right: 8px; bottom: 96px; display: grid; gap: 8px; z-index: 3; }
.float button, .tools button { width: 52px; height: 52px; background: #1d1430f0; border: 1px solid var(--line); display: grid; place-items: center; } .float button.on, .tools button.on { background: var(--accent); color: var(--on-accent); }
.tools { position: absolute; inset: auto 0 0 0; display: flex; background: var(--surface); border-top: 1px solid var(--line); z-index: 3; } .tools button { flex: 1; width: auto; height: 60px; border: 0; font-size: 12px; align-content: center; gap: 2px; }
.ghostbar { position: absolute; inset: auto 0 60px 0; display: grid; grid-template-columns: 60px 60px 1fr 60px; z-index: 4; border-top: 1px solid var(--line); } .ghostbar button { height: 60px; display: grid; place-items: center; background: var(--panel2); } .ghostbar .cta { background: var(--accent); }
.ghost { position: absolute; left: 50%; top: 42%; z-index: 2; pointer-events: none; border: 2px dashed var(--accent); background: #ff6a1a33; transform: translate(-50%, -50%); display: grid; place-items: center; font-size: 13px; }
.port { position: absolute; width: 22px; height: 22px; } .port.i { background: var(--in); } .port.o { background: var(--out); } .port.sel { outline: 3px solid var(--accent); }
.say { position: absolute; left: 50%; transform: translateX(-50%); bottom: 130px; background: #1d1430f0; border-left: 3px solid var(--accent); padding: 8px 12px; font-size: 14px; z-index: 5; white-space: nowrap; }

/* Paysage et tablette : rail à gauche, panneau à droite */
@container dev (min-aspect-ratio: 1/1) {
  .app { grid-template: "bar head" auto "bar stage" 1fr / 76px 1fr; }
  .bar { flex-direction: column; border-top: 0; border-right: 1px solid var(--line); padding: 0 0 0 env(safe-area-inset-left); overflow: auto; }
  .bar button, .bar .menu { flex: 0 1 68px; min-height: 48px; width: 100%; height: auto; } .bar .menu { order: -1; flex: 0 0 55px; }
  .bar button.on::before { inset: 10% auto 10% 0; width: 3px; height: auto; }
  .sheet { left: auto; width: min(340px, 46cqw); border-top: 0; border-left: 3px solid var(--accent); transform: none; } .sheet .body { max-height: none; } .sheet .grip i { display: none; }
  .has-sheet .map, .has-sheet .views, .has-sheet .tools, .has-sheet .ghostbar { right: min(340px, 46cqw); } .has-sheet .float { right: calc(min(340px, 46cqw) + 8px); }
  .float { bottom: 12px; } .modal { flex-direction: row; justify-content: flex-end; } .modal .in, .modal .in.full { width: min(440px, 70cqw); height: 100%; max-height: none; border-top: 0; border-left: 3px solid var(--accent); }
}
@container dev (max-height: 480px) { .head { height: 44px; } .head .t, .head .i { height: 44px; } .views button { height: 44px; } .float { grid-auto-flow: column; } .bar button, .bar .menu { min-height: 44px; flex: 1 1 44px; gap: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
</style>
</head>
<body>
<div class="lab"><button data-dir="A" class="on">A · Onglets</button><button data-dir="B">B · Dock</button>
<span class="sz">&nbsp; <button data-sz="390,844" class="on">390</button><button data-sz="360,800">360</button><button data-sz="844,390">Paysage</button><button data-sz="768,1024">Tablette</button><button data-sz="1024,768">Tablette ↔</button></span></div>
<div class="room"><div class="dev" id="dev"></div></div>
<script>
const P = { plan: "M3 21V9l6 4V9l6 4V4h6v17z", rec: "M4 4h16v16H4zM4 10h16M10 10v10", bac: "M3 3h8v8H3zM13 13h8v8h-8zM17 3v6M14 6h6M7 14v6M4 17h6", me: "M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-5 16-5 16 0", plus: "M4 6h16M4 12h16M4 18h16", tree: "M3 10h6v5H3zM15 3h6v5h-6zM15 16h6v5h-6zM9 12h3V5h3M12 12v7h3", share: "M18 8a3 3 0 100-6 3 3 0 000 6zM6 15a3 3 0 100-6 3 3 0 000 6zM18 22a3 3 0 100-6 3 3 0 000 6zM9 13l6 4M9 11l6-5", x: "M5 5l14 14M19 5L5 19", find: "M11 18a7 7 0 100-14 7 7 0 000 14zM16 16l5 5", fit: "M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5", edit: "M4 20l4-1L20 7l-3-3L5 16z", set: "M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4", check: "M5 12l5 5L20 7", undo: "M9 7L4 12l5 5M4 12h10a6 6 0 010 8", rot: "M20 11a8 8 0 10-2 6M20 5v6h-6", link: "M10 14l4-4M8 12l-3 3a3 3 0 004 4l3-3M16 12l3-3a3 3 0 00-4-4l-3 3", del: "M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13", list: "M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1", flow: "M3 5h7v5H3zM14 14h7v5h-7zM10 8h4v9", stat: "M4 20V10M10 20V4M16 20v-8M21 20H3", hand: "M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3" };
const I = (k) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[k]}"/></svg>`;
const STEPS = [["Advanced Assembler", 5, "Crankshaft"], ["Industrial Roller", 12, "Gear"], ["Industrial Roller", 6, "Steel Rod"], ["Press", 16, "Steel Plate"], ["Blast Furnace", 5, "Steel Ingot"], ["Ingot Molder", 4, "Iron Ingot"], ["Electric Furnace", 3, "Liquid Iron"], ["Blast Furnace", 1, "Iron Mix"], ["Grinder", 5, "Iron Powder"], ["Iron Drill", 18, "Raw Iron"]];
const NODES = [["Crankshaft", "Advanced Assembler", 5, 700, 130], ["Gear", "Industrial Roller", 12, 460, 40], ["Steel Rod", "Industrial Roller", 6, 460, 220], ["Steel Plate", "Press", 16, 220, 40], ["Steel Ingot", "Blast Furnace", 5, -20, 130]];
const EDGES = [[1, 0, "240/min"], [2, 0, "120/min"], [3, 1, "240/min"], [4, 3, ""], [4, 2, ""]];
const FP = [["Crankshaft", 10, 560, 190, 110], ["Steel Ingot", 130, 270, 70, 260], ["Iron Ingot", 10, 400, 100, 60], ["Iron Powder", 10, 290, 100, 70], ["Raw Iron", 10, 150, 100, 110], ["Steel Plate", 230, 120, 110, 180], ["Gear", 230, 330, 110, 130], ["Steel Rod", 230, 490, 110, 110]];
const ITEMS = ["Crankshaft", "Gear", "Steel Rod", "Steel Plate", "Steel Ingot", "Iron Ingot", "Copper Wire", "Copper Plate", "Aluminium Ingot", "Clay Brick", "Concrete Block", "Cement", "Boron", "Chlorine", "Acetic Acid", "Ammonia"];
const PRIO = ["Le moins de place", "Le moins de machines", "Le moins d'énergie", "Le moins cher", "Le moins de pollution", "Le moins de matières premières", "La chaîne la plus courte"];
const RES = ["Production", "Water Pump", "Research Station"];
const s = { dir: "A", page: "plan", view: "liste", node: -1, mod: -1, snap: 0, modal: "", item: "Crankshaft", qty: 60, done: new Set(), edit: false, link: -1, me: "recherches", res: new Set(["Production"]), rec: "", recsel: "", tool: "voir", sel: "", rot: 0, posed: [{ n: "Press", x: 70, y: 90 }, { n: "Roller", x: 250, y: 90 }], pipes: [], port: null, say: "", goal: "Un objet", pages: {} };
const views = {}; // position de chaque dessin
const $ = (q) => document.querySelector(q), dev = $("#dev");
const nav = [["plan", "Planifier", "plan"], ["recettes", "Recettes", "rec"], ["bac", "Bac à sable", "bac"], ["partie", "Ma partie", "me"], ["plus", "Plus", "plus"]];
const pv = [["liste", "Étapes", "list"], ["schema", "Schéma", "flow"], ["usine", "Usine", "plan"], ["bilan", "Bilan", "stat"]];
const row = (act, main, sub, right = "", cls = "", lead = "") => `<button class="row ${cls}" data-a="${act}">${lead}<span class="g">${main}${sub ? `<small>${sub}</small>` : ""}</span>${right}</button>`;
const sq = (n) => `<span class="sq">${n.slice(0, 2)}</span>`;

function head() {
  const t = { recettes: "Recettes", bac: "Bac à sable", partie: "Ma partie", plus: "Plus", contribuer: "Contribuer", methodes: "Méthodes", propositions: "Propositions" }[s.page];
  if (s.page === "plan") return `<button class="t" data-a="modal:goal"><span>${s.item}</span><b>${s.qty}/min</b>${I("edit")}</button><button class="i" data-a="modal:set" aria-label="Réglages">${I("set")}</button><button class="i" data-a="modal:share" aria-label="Partager">${I("share")}</button>`;
  return `<span class="t"><span>${t}</span></span>${s.page === "bac" ? `<button class="i" data-a="undo" aria-label="Annuler">${I("undo")}</button><button class="i" data-a="stats" aria-label="Statistiques">${I("stat")}</button>` : ""}`;
}
const bilan = () => `<div class="kpi"><div><small>Cases au sol</small>2 252</div><div><small>Machines</small>82</div><div><small>Énergie</small>1,92 MMF/s</div><div><small>Prix</small>8,88 M$</div></div>`;
function stage() {
  const p = s.page;
  if (p === "plan") {
    const top = s.dir === "A" ? `<div class="views">${pv.map(([k, n]) => `<button data-a="view:${k}" class="${s.view === k ? "on" : ""}">${n}</button>`).join("")}</div>` : "";
    const pad = s.dir === "A" ? "top:48px" : "";
    if (s.view === "liste") return top + `<div class="scroll" style="${pad}">${STEPS.map((x, i) => row("done:" + i, x[0], x[2], `<span class="n">×${x[1]}</span>`, s.done.has(i) ? "done" : "", `<span class="chk">${s.done.has(i) ? I("check") : ""}</span>`)).join("")}</div>`;
    if (s.view === "bilan") return top + `<div class="scroll" style="${pad}">${bilan()}<div class="h">À régler</div>${row("", "7 points", "")}<div class="h">Exporter</div>${row("page:bac", "Ouvrir dans le bac à sable")}${row("modal:share", "Fichier")}</div>`;
    const fl = `<div class="float"><button data-a="fit" aria-label="Tout voir">${I("fit")}</button>${s.view === "schema" ? `<button data-a="edit" class="${s.edit ? "on" : ""}" aria-label="Modifier">${I("edit")}</button>` : ""}</div>`;
    return top + `<div class="map" style="${pad}" data-map="${s.view}"><div class="w">${s.view === "schema" ? graph() : plant()}</div></div>${fl}${sheet()}`;
  }

dev.addEventListener("pointerdown", (e) => { const g = e.target.closest(".grip"); if (!g || e.target.closest("button")) return; const sh = g.parentElement; dg = { y: e.clientY, v: parseFloat(getComputedStyle(sh).getPropertyValue("--v")), sh, m: 0, g }; g.setPointerCapture(e.pointerId); sh.classList.add("drag"); });
dev.addEventListener("pointermove", (e) => { if (!dg) return; dg.m = dg.y - e.clientY; setSnap(Math.max(84, Math.min(dg.sh.parentElement.clientHeight, dg.v + dg.m))); });
const end = () => { if (!dg) return; const { m, sh } = dg; dg = null; sh.classList.remove("drag"); if (Math.abs(m) < 8) s.snap = s.snap ? 0 : 1; else s.snap = Math.max(0, Math.min(2, s.snap + Math.sign(m) * (Math.abs(m) > 320 ? 2 : 1))); setSnap(); };
dev.addEventListener("pointerup", end); dev.addEventListener("pointercancel", end);
const pick = (b, q) => { document.querySelectorAll(q).forEach((x) => x.classList.toggle("on", x === b)); };
document.querySelectorAll("[data-dir]").forEach((b) => (b.onclick = () => { s.dir = b.dataset.dir; s.modal = ""; pick(b, "[data-dir]"); for (const k in views) delete views[k]; draw(); }));
document.querySelectorAll("[data-sz]").forEach((b) => (b.onclick = () => { const [w, h] = b.dataset.sz.split(","); dev.style.setProperty("--w", w + "px"); dev.style.setProperty("--h", h + "px"); pick(b, "[data-sz]"); for (const k in views) delete views[k]; draw(); }));
let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => setSnap(), 60); }).observe(dev);
draw();
</script>
</body>
