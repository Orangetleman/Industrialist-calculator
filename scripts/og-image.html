<!doctype html>
<!-- Image d'aperçu des liens (og:image, 1200 × 630), S33 : en anglais, comme l'aperçu Discord (décision S16 Public).
     Rendu par Chrome sans fenêtre, depuis la racine du dépôt :
       chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=public/og-image.png scripts/og-image.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@700&family=IBM+Plex+Sans:wght@400&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      linear-gradient(rgba(143, 184, 214, .06) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(143, 184, 214, .06) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(180deg, #1f3d52 0%, #12171c 100%);
    color: #e6ebf0; font-family: "IBM Plex Sans", sans-serif;
    display: flex; align-items: center; gap: 56px; padding: 0 70px; box-sizing: border-box;
  }
  .logo { width: 280px; height: 280px; flex: none; border-radius: 56px; filter: drop-shadow(0 10px 30px rgba(0, 0, 0, .35)); }
  .eyebrow { font: 500 26px "IBM Plex Mono", monospace; letter-spacing: .04em; color: #f0913a; }
  h1 { font: 700 74px/1.04 "IBM Plex Sans Condensed", sans-serif; margin: 14px 0 18px; letter-spacing: -.01em; }
  p { font-size: 30px; line-height: 1.35; color: #c4ced8; margin: 0; }
  .url { margin-top: 34px; font: 500 26px "IBM Plex Mono", monospace; color: #8fb8d6; }
</style>
</head>
<body>
  <img class="logo" src="../public/favicon.svg" alt="">
  <div>
    <div class="eyebrow">INDUSTRIALIST · ROBLOX · UNOFFICIAL</div>
    <h1>Industrialist<br>Production Planner</h1>
    <p>Full production chains, power and build plans,<br>based on what you have unlocked.</p>
    <div class="url">industrialist.myprisme.fr</div>
  </div>
</body>
</html>
